# Posts an automated review on every new or updated pull request.
# Needs the ANTHROPIC_API_KEY repository secret and the Claude GitHub App installed.
# PRs from forks don't receive repository secrets, so this job only runs for same-repo branches.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for correctness bugs, security problems and missing tests.
            Follow the conventions in CLAUDE.md. Be concise and only comment on real problems.
            Post your findings as a PR comment.
